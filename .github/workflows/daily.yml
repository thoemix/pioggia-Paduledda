name: Pioggia giornaliera

permissions:
  contents: write

on:
  schedule:
    - cron: '5 6 * * *'   # täglich 06:05 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run script
        run: python scrape.py

      - name: Commit Excel
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pioggia.xlsx
          git commit -m "Aggiorna pioggia" || echo "Nessuna modifica"
          git push
